version: "1.0"
process:
  id: customer_creation
  name: Customer Creation
  owner: data_governance_lead
  start: request
roles:
  - {id: sales, name: Sales}
  - {id: data_steward, name: Data Steward}
  - {id: data_governance_lead, name: Data Governance Lead}
systems:
  - {id: mdg, name: SAP Master Data Governance}
steps:
  - id: request
    name: Submit customer request
    actor: sales
    system: mdg
    next: validate
  - id: validate
    name: Validate and enrich request
    actor: data_steward
    system: mdg
    next: approve
  - id: approve
    name: Approve customer
    type: decision
    actor: data_governance_lead
    system: mdg
    branches:
      approved: complete
      rejected: rejected
  - {id: complete, name: Customer approved, type: end}
  - {id: rejected, name: Request rejected, type: end}
