version: "1.0"
process:
  id: customer_creation
  name: Customer Creation
  description: Govern a customer request, approve it, replicate it to S/4HANA, and confirm downstream availability.
  owner: data_governance_lead
  trigger: Sales requests a new customer
  outcome: Customer is available for operational use
  start: request

roles:
  - id: sales
    name: Sales
  - id: data_steward
    name: Data Steward
  - id: data_governance_lead
    name: Data Governance Lead
  - id: operations
    name: Operations

systems:
  - id: mdg
    name: SAP Master Data Governance
  - id: s4
    name: SAP S/4HANA

objects:
  - id: customer
    name: Customer master

interfaces:
  - id: mdg_to_s4
    name: MDG to S/4 replication
    protocol: IDoc/API

controls:
  - id: duplicate_check
    name: Duplicate customer check
  - id: mandatory_data
    name: Mandatory data completeness

steps:
  - id: request
    name: Submit customer request
    type: user_task
    actor: sales
    system: mdg
    objects: [customer]
    next: validate

  - id: validate
    name: Validate request data
    type: user_task
    actor: data_steward
    system: mdg
    controls: [duplicate_check, mandatory_data]
    next: approve

  - id: approve
    name: Approve customer
    type: decision
    actor: data_governance_lead
    system: mdg
    raci:
      responsible: data_governance_lead
      accountable: data_governance_lead
      consulted: [data_steward]
      informed: [sales]
    branches:
      approved: replicate
      rejected: rejected

  - id: replicate
    name: Replicate customer to S/4HANA
    type: service_task
    system: mdg
    objects: [customer]
    interfaces: [mdg_to_s4]
    next: verify

  - id: verify
    name: Verify downstream customer
    type: user_task
    actor: operations
    system: s4
    objects: [customer]
    next: completed

  - id: completed
    name: Customer available
    type: end

  - id: rejected
    name: Request rejected
    type: end
