version: "1.0"
process:
  id: order_to_cash
  name: Order to Cash — Simplified
  owner: otc_process_owner
  trigger: Customer order received
  outcome: Order delivered and billing completed
  start: receive_order

roles:
  - {id: sales_ops, name: Sales Operations}
  - {id: warehouse, name: Warehouse}
  - {id: otc_process_owner, name: O2C Process Owner}

systems:
  - {id: s4, name: SAP S/4HANA}
  - {id: carrier, name: Carrier Platform}

objects:
  - {id: sales_order, name: Sales Order}
  - {id: delivery, name: Outbound Delivery}
  - {id: invoice, name: Billing Document}

interfaces:
  - {id: carrier_booking, name: Carrier booking interface}

controls:
  - {id: credit_check, name: Credit availability check}

steps:
  - id: receive_order
    name: Create sales order
    type: user_task
    actor: sales_ops
    system: s4
    objects: [sales_order]
    next: check_credit
  - id: check_credit
    name: Check credit
    type: decision
    system: s4
    controls: [credit_check]
    branches:
      released: create_delivery
      blocked: credit_block
  - id: create_delivery
    name: Create delivery
    type: service_task
    system: s4
    objects: [delivery]
    next: book_transport
  - id: book_transport
    name: Book transport
    type: service_task
    system: s4
    interfaces: [carrier_booking]
    next: goods_issue
  - id: goods_issue
    name: Post goods issue
    type: user_task
    actor: warehouse
    system: s4
    next: bill
  - id: bill
    name: Create invoice
    type: service_task
    system: s4
    objects: [invoice]
    next: complete
  - {id: complete, name: O2C complete, type: end}
  - {id: credit_block, name: Order blocked for credit, type: end}
