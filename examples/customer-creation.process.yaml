version: "0.2"
process:
  id: customer_creation
  name: Customer Creation
  owner: data_governance_lead
  start: request
  trigger: Approved commercial need for a new customer
  outcome: Customer is available and reconciled in the target system
roles:
  - {id: sales, name: Sales}
  - {id: data_governance_lead, name: Data Governance Lead}
  - {id: operations, name: Operations}
systems:
  - {id: mdg, name: SAP Master Data Governance}
  - {id: s4, name: SAP S/4HANA}
objects:
  - {id: business_partner, name: Business Partner}
interfaces:
  - {id: customer_replication, name: Customer replication}
controls:
  - {id: sanctions_check, name: Sanctions screening}
risks:
  - {id: restricted_party, name: Restricted-party creation, severity: high}
evidence:
  - {id: screening_result, name: Screening result}
steps:
  - id: request
    name: Submit customer request
    type: user_task
    actor: sales
    system: mdg
    objects: [business_partner]
    inputs: [{id: customer_request, type: form, required: true}]
    transitions: [{to: approve}]
  - id: approve
    name: Approve customer
    type: decision
    actor: data_governance_lead
    system: mdg
    objects: [business_partner]
    controls: [sanctions_check]
    risks: [restricted_party]
    evidence: [screening_result]
    sla: {duration: PT4H, business_hours: true}
    agent:
      exposable: true
      executable: false
      allowed_actions: [explain_status, list_controls]
    transitions:
      - {to: replicate, label: approved, when: approved}
      - {to: rejected, label: rejected, when: rejected}
  - id: replicate
    name: Replicate customer
    type: service_task
    system: mdg
    interfaces: [customer_replication]
    objects: [business_partner]
    sla: {duration: PT15M}
    outputs: [{id: replicated_bp, type: business_object}]
    transitions: [{to: validate}]
  - id: validate
    name: Validate downstream creation
    type: user_task
    actor: operations
    system: s4
    objects: [business_partner]
    sla: {duration: PT30M}
    kpis:
      - {id: downstream_validation_time, name: Downstream validation time, target: 30, unit: minutes}
    transitions: [{to: complete}]
  - {id: complete, name: Customer created, type: end}
  - {id: rejected, name: Request rejected, type: end}
