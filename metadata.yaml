name: Process as Code
slug: process-as-code
status: alpha
version: 0.1.0
owner: Dzmitryi Kharlanau
license: MIT
repository: https://github.com/dkharlanau/process-as-code
purpose: >-
  Define business processes as Git-native structured files and derive validation,
  diagrams, BPMN, documentation, RACI, test scope, and semantic change reports.
capabilities:
  - yaml_json_process_definition
  - reference_validation
  - graph_validation
  - mermaid_export
  - bpmn_2_export
  - markdown_documentation
  - raci_extraction
  - test_scope_generation
  - semantic_diff
  - change_impact_analysis
principles:
  - git_first
  - deterministic_first
  - machine_readable
  - vendor_neutral_core
  - composable
  - agent_ready
entrypoints:
  cli: process-code
  schema: schemas/process.schema.json
examples:
  - examples/customer-creation.yaml
  - examples/order-to-cash.yaml
