name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: process-code schema -o /tmp/process.schema.json
      - run: process-code validate examples/customer-creation.process.yaml --strict
      - run: process-code policy examples/customer-creation.process.yaml --policy examples/policy.yaml
      - run: process-code resolve examples/enterprise-change/customer.process.yaml --base-dir examples/enterprise-change --json > /tmp/refs.json
      - run: process-code conformance conformance/v0.2
      - run: process-code catalog examples -o /tmp/process-site --base-url https://example.test/process-as-code
      - run: process-code observe examples/sap/order-to-cash.process.yaml examples/observed/order-to-cash.events.csv --json > /tmp/observed.json
      - run: process-code jsonld examples/customer-creation.process.yaml -o /tmp/customer.jsonld
      - run: process-code draft-context examples/drafting/customer-onboarding.txt --json -o /tmp/draft.json
      - run: process-code adapter-import csv-manifest examples/adapters/process-manifest.csv -o /tmp/imported.process.yaml
      - run: process-code validate /tmp/imported.process.yaml --strict

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Process as Code composite Action
        uses: ./
        with:
          process-glob: "**/*.process.yaml"
          policy-file: examples/policy.yaml
          github-token: ${{ github.token }}
          fail-on-warning: "false"
      - name: Verify Action outputs
        run: |
          test -s process-impact-report.md
          test -s process-impact-report.json
          python - <<'PY'
          import json
          data = json.load(open('process-impact-report.json', encoding='utf-8'))
          assert 'base' in data and 'head' in data
          assert 'files' in data
          assert data['failures'] == 0
          PY

  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[mcp]'
      - run: python -c "from process_as_code.mcp_server import create_server; create_server('examples')"

  web-editor-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check vscode-extension/extension.js
      - run: node -e "JSON.parse(require('fs').readFileSync('vscode-extension/package.json','utf8')); JSON.parse(require('fs').readFileSync('vscode-extension/snippets.json','utf8')); JSON.parse(require('fs').readFileSync('vscode-extension/process.schema.json','utf8'))"
      - run: grep -q "yamlValidation" vscode-extension/package.json
      - run: grep -q "not uploaded or stored" web/playground/index.html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/pac-wheel
          /tmp/pac-wheel/bin/python -m pip install --upgrade pip
          /tmp/pac-wheel/bin/pip install dist/*.whl
          cd /tmp
          printf '%s\n' 'Create and approve a customer request, then replicate it to the target system.' > process-description.txt
          /tmp/pac-wheel/bin/process-code schema -o process.schema.json
          /tmp/pac-wheel/bin/process-code draft-context process-description.txt --json -o draft-context.json
          /tmp/pac-wheel/bin/python - <<'PY'
          import json
          schema = json.load(open('/tmp/process.schema.json', encoding='utf-8'))
          draft = json.load(open('/tmp/draft-context.json', encoding='utf-8'))
          assert schema['title'] == 'Process as Code contract v0.2'
          assert draft['schema']['title'] == schema['title']
          assert draft['schema_source'].startswith('package:')
          PY
