name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: process-code validate examples/customer-creation.yaml --strict
      - run: process-code validate examples/order-to-cash.yaml --strict
      - run: process-code impact examples/customer-creation.yaml examples/change-request-v2.yaml --json > /tmp/impact.json
