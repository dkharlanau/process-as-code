name: Process as Code Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Build process catalog
        run: |
          mkdir -p _site/catalog
          process-code catalog examples -o _site/catalog --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/catalog"
      - name: Stage product home and playground
        run: |
          cp docs/product.html _site/index.html
          cp docs/agent-manifest.json _site/agent-manifest.json
          cp -R web/playground _site/playground
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
