[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "process-as-code"
version = "0.1.0"
description = "Git-native business process definitions with validation, diagrams, BPMN, RACI, test scope, and semantic diff."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dzmitryi Kharlanau"}]
dependencies = ["PyYAML>=6.0"]
keywords = ["process", "bpmn", "business-process", "process-as-code", "enterprise", "gitops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
process-code = "process_as_code.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
