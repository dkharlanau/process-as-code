[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "process-as-code"
version = "0.2.0"
description = "Open process contracts for Git, CI, enterprise change impact, and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dzmitryi Kharlanau"}]
dependencies = ["PyYAML>=6.0"]
keywords = ["process", "bpmn", "business-process", "process-as-code", "enterprise", "gitops", "mcp", "process-governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/dkharlanau/process-as-code"
Documentation = "https://dkharlanau.github.io/process-as-code/"
Repository = "https://github.com/dkharlanau/process-as-code"
Issues = "https://github.com/dkharlanau/process-as-code/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=2,<3"]

[project.scripts]
process-code = "process_as_code.entrypoint:main"
process-code-mcp = "process_as_code.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
process_as_code = ["resources/*.json"]
